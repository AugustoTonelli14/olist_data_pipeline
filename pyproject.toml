[project]
name = "olist-data-pipeline"
version = "1.0.0"
description = "Production-grade data pipeline for Brazilian E-Commerce (Olist) dataset"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "transformation", "modeling", "pipeline", "analytics", "storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

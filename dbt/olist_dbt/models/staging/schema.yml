version: 2

models:
  - name: stg_orders
    description: "Staged order data with timestamps and status"
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Customer who placed the order"
        tests:
          - not_null
      - name: order_status
        description: "Current order status"
        tests:
          - not_null
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - unavailable
                - invoiced
                - processing
                - created
                - approved
                - unknown

  - name: stg_customers
    description: "Staged customer demographics and location"
    columns:
      - name: customer_id
        description: "Unique customer identifier per order"
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: "Unique customer across orders"
        tests:
          - not_null
      - name: customer_state
        description: "Brazilian state abbreviation"
        tests:
          - not_null

  - name: stg_products
    description: "Staged product catalog with English categories"
    columns:
      - name: product_id
        description: "Unique product identifier"
        tests:
          - not_null
          - unique
      - name: product_category_name_english
        description: "Product category translated to English"
        tests:
          - not_null

  - name: stg_sellers
    description: "Staged seller information"
    columns:
      - name: seller_id
        description: "Unique seller identifier"
        tests:
          - not_null
          - unique
      - name: seller_state
        description: "Brazilian state abbreviation"
        tests:
          - not_null

  - name: stg_order_items
    description: "Staged order line items with pricing"
    columns:
      - name: order_id
        description: "Order this item belongs to"
        tests:
          - not_null
      - name: product_id
        description: "Product in this line item"
        tests:
          - not_null
      - name: price
        description: "Item unit price in BRL"
        tests:
          - not_null

  - name: stg_payments
    description: "Staged payment transactions"
    columns:
      - name: order_id
        description: "Order this payment belongs to"
        tests:
          - not_null
      - name: payment_type
        description: "Method of payment"
        tests:
          - not_null
          - accepted_values:
              values:
                - credit_card
                - boleto
                - voucher
                - debit_card
                - not_defined
                - unknown
      - name: payment_value
        description: "Payment amount in BRL"
        tests:
          - not_null

  - name: stg_reviews
    description: "Staged customer reviews"
    columns:
      - name: review_id
        description: "Unique review identifier"
        tests:
          - not_null
      - name: order_id
        description: "Order being reviewed"
        tests:
          - not_null
      - name: review_score
        description: "Rating from 1 to 5"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

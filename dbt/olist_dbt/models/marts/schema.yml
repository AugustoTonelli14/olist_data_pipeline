version: 2

models:
  - name: dim_customers
    description: "Customer dimension — one row per customer"
    columns:
      - name: customer_key
        description: "Primary key (customer_id)"
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: "Unique customer identifier across orders"
        tests:
          - not_null
      - name: customer_state
        description: "Brazilian state abbreviation"
        tests:
          - not_null

  - name: dim_products
    description: "Product dimension — one row per product"
    columns:
      - name: product_key
        description: "Primary key (product_id)"
        tests:
          - not_null
          - unique
      - name: category_name
        description: "Product category in English"
        tests:
          - not_null

  - name: dim_sellers
    description: "Seller dimension — one row per seller"
    columns:
      - name: seller_key
        description: "Primary key (seller_id)"
        tests:
          - not_null
          - unique
      - name: seller_state
        description: "Brazilian state abbreviation"
        tests:
          - not_null

  - name: dim_date
    description: "Date dimension — one row per calendar day"
    columns:
      - name: date_key
        description: "Primary key (YYYYMMDD integer)"
        tests:
          - not_null
          - unique
      - name: full_date
        description: "Calendar date"
        tests:
          - not_null
      - name: year
        description: "Calendar year"
      - name: month
        description: "Calendar month (1-12)"
      - name: is_weekend
        description: "True if Saturday or Sunday"

  - name: dim_location
    description: "Location dimension — one row per zip code prefix"
    columns:
      - name: location_key
        description: "Primary key (zip code prefix)"
        tests:
          - not_null
          - unique
      - name: state
        description: "Brazilian state abbreviation"
        tests:
          - not_null

  - name: fact_orders
    description: "Fact table — one row per order-item"
    columns:
      - name: order_id
        description: "Order identifier"
        tests:
          - not_null
      - name: customer_key
        description: "FK to dim_customers"
        tests:
          - not_null
      - name: seller_key
        description: "FK to dim_sellers"
        tests:
          - not_null
      - name: product_key
        description: "FK to dim_products"
        tests:
          - not_null
      - name: date_key
        description: "FK to dim_date (YYYYMMDD)"
        tests:
          - not_null
      - name: payment_value
        description: "Total payment amount in BRL"
        tests:
          - not_null
      - name: price
        description: "Item unit price in BRL"
        tests:
          - not_null
      - name: review_score
        description: "Customer rating (1-5, 0 if missing)"
